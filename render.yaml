services:
  - type: web
    name: cognivex-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SUPABASE_URL
        value: https://tgqjilgdnyzktppkybmu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_CHAT_TABLE
        value: Chat_History
      - key: CORS_ORIGINS
        value: "*"
